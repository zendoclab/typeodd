[package]
name = "typeodd-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
